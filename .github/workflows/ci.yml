name: LifeTrack Pro CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    name: Backend Test Suite & Health Validation
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: lifetrack_test
          POSTGRES_USER: lifetrack
          POSTGRES_PASSWORD: testpassword123
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements/base.txt
          pip install pytest pytest-django pytest-cov whitenoise

      - name: Run Backend Pytest Suite
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://lifetrack:testpassword123@localhost:5432/lifetrack_test
          SECRET_KEY: ci-test-secret-key-for-automated-verification-1234
          DEBUG: "True"
        run: |
          python -m pytest

  frontend-build:
    name: Frontend TypeScript, Lint & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run Linter
        working-directory: ./frontend
        run: npm run lint

      - name: Run TypeScript Production Build
        working-directory: ./frontend
        run: npm run build
