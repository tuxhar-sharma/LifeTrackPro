services:
  db:
    image: postgres:16-alpine
    container_name: lifetrack_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: lifetrack_pro
      POSTGRES_USER: lifetrack
      POSTGRES_PASSWORD: lifetrack_secret_password_123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lifetrack -d lifetrack_pro"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: lifetrack_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lifetrack_backend
    restart: unless-stopped
    environment:
      DEBUG: "False"
      SECRET_KEY: "django-production-insecure-change-in-real-env-key-998811"
      DATABASE_URL: "postgresql://lifetrack:lifetrack_secret_password_123@db:5432/lifetrack_pro"
      ALLOWED_HOSTS: "localhost,127.0.0.1,backend"
      CORS_ALLOWED_ORIGINS: "http://localhost,http://localhost:5173,http://localhost:80"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lifetrack_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:
