<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />

    <!-- Primary Brand Title Fallback -->
    <title>LifeTrack Pro | High-Performance Life &amp; Financial Telemetry</title>
    <meta name="title" content="LifeTrack Pro | High-Performance Life &amp; Financial Telemetry" />
    <meta
      name="description"
      content="LifeTrack Pro combines double-entry financial ledgering with atomic habit discipline. Track expenses with cents precision and build unbreakable daily streaks."
    />
    <meta
      name="keywords"
      content="habit tracker, financial ledger, expense tracker, personal telemetry, discipline index, streak tracker, productivity OS, lifetrack pro"
    />
    <meta name="author" content="LifeTrack Pro Team" />
    <meta name="robots" content="index, follow" />

    <!-- Favicon & PWA Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.svg" />
    <link rel="mask-icon" href="/favicon.svg" color="#6366f1" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Mobile & PWA Configuration -->
    <meta name="theme-color" content="#07090e" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="LifeTrack Pro" />
    <meta name="application-name" content="LifeTrack Pro" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="LifeTrack Pro" />
    <meta property="og:url" content="https://lifetrackpro.io" />
    <meta property="og:title" content="LifeTrack Pro | High-Performance Life &amp; Financial Telemetry" />
    <meta
      property="og:description"
      content="Unify financial accountability and atomic habit mastery into a single telemetry dashboard. Track expenses with cents precision and scale discipline."
    />
    <meta property="og:image" content="/og-image.svg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/svg+xml" />

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@lifetrackpro" />
    <meta name="twitter:creator" content="@lifetrackpro" />
    <meta name="twitter:title" content="LifeTrack Pro | High-Performance Life &amp; Financial Telemetry" />
    <meta
      name="twitter:description"
      content="Unify financial accountability and atomic habit mastery into a single telemetry dashboard. Track expenses with cents precision and scale discipline."
    />
    <meta name="twitter:image" content="/og-image.svg" />

    <!-- Preconnect & Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-[#07090e] text-slate-100 antialiased selection:bg-indigo-500/30 selection:text-indigo-300">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
