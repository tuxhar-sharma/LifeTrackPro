<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="ogBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090e" />
      <stop offset="50%" stop-color="#0d111d" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <linearGradient id="ogLogoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <filter id="ogGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#ogBg)" />

  <!-- Ambient Glows -->
  <circle cx="200" cy="150" r="220" fill="#4f46e5" opacity="0.18" filter="url(#ogGlow)" />
  <circle cx="1000" cy="480" r="260" fill="#10b981" opacity="0.14" filter="url(#ogGlow)" />

  <!-- Outer frame border -->
  <rect x="20" y="20" width="1160" height="590" rx="24" fill="none" stroke="#1e293b" stroke-width="2" />

  <!-- Telemetry Grid background lines -->
  <path d="M60 200 H1140 M60 300 H1140 M60 400 H1140 M60 500 H1140" stroke="#1e293b" stroke-width="1" stroke-dasharray="6 6" opacity="0.4" />
  <path d="M300 40 V590 M600 40 V590 M900 40 V590" stroke="#1e293b" stroke-width="1" stroke-dasharray="6 6" opacity="0.3" />

  <!-- Brand Mark -->
  <rect x="80" y="80" width="80" height="80" rx="22" fill="url(#ogLogoGrad)" stroke="rgba(255,255,255,0.2)" stroke-width="2" />
  <path d="M125 96 L104 124 H120 L116 148 L138 120 L122 120 L125 96 Z" fill="#ffffff" />

  <!-- Title and Subtitle -->
  <text x="180" y="130" fill="url(#textGrad)" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.02em">
    LifeTrack <tspan fill="#818cf8">Pro</tspan>
  </text>
  <text x="180" y="156" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" letter-spacing="0.1em">
    TELEMETRY &amp; DISCIPLINE OS
  </text>

  <!-- Main Headline -->
  <text x="80" y="270" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="800" letter-spacing="-0.03em">
    High-Performance Life &amp; Financial Telemetry.
  </text>
  <text x="80" y="325" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="400">
    Unify double-entry financial ledgering with atomic habit discipline.
  </text>

  <!-- Metric Badges -->
  <g transform="translate(80, 400)">
    <!-- Badge 1: Financial Ledger -->
    <rect x="0" y="0" width="310" height="110" rx="16" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
    <text x="24" y="38" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" letter-spacing="0.05em">PRECISION FINANCIAL LEDGER</text>
    <text x="24" y="78" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800">Cents Precision</text>
    <text x="24" y="96" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="12">Multi-Currency &amp; Burn Tracking</text>

    <!-- Badge 2: Discipline Index -->
    <rect x="330" y="0" width="310" height="110" rx="16" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
    <text x="354" y="38" fill="#10b981" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" letter-spacing="0.05em">ATOMIC HABIT ENGINE</text>
    <text x="354" y="78" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800">94% Discipline</text>
    <text x="354" y="96" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="12">Automated Streak Multipliers</text>

    <!-- Badge 3: Privacy & Tenancy -->
    <rect x="660" y="0" width="380" height="110" rx="16" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
    <text x="684" y="38" fill="#818cf8" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" letter-spacing="0.05em">SYSTEM ARCHITECTURE</text>
    <text x="684" y="78" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800">Argon2id + JWT</text>
    <text x="684" y="96" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="12">Zero Telemetry Leakage</text>
  </g>

  <!-- URL watermark -->
  <text x="80" y="565" fill="#475569" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600">
    lifetrackpro.io • The Modern Productivity &amp; Financial Protocol
  </text>
</svg>
