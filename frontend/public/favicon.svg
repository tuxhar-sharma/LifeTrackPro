<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="#090d16" stroke="rgba(99, 102, 241, 0.4)" stroke-width="1.5" />
  <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#brandGrad)" />

  <!-- Subtle inner telemetry grid/pulse lines -->
  <path d="M4 32 H18 L24 24 L30 40 L36 28 L42 34 L48 32 H60" stroke="rgba(255, 255, 255, 0.18)" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Dynamic Zap Icon -->
  <path d="M35 13 L20 33 H32 L29 51 L44 31 H32 L35 13 Z" fill="url(#boltGrad)" filter="url(#glow)" stroke="#ffffff" stroke-width="0.5" stroke-linejoin="round" />

  <!-- Corner spark accent -->
  <circle cx="48" cy="16" r="2.5" fill="#38bdf8" />
</svg>